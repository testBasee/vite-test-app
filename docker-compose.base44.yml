services:
  web:
    image: node:22
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:8080"
    volumes:
      - .:/app
      - /app/node_modules
    command: ["sh", "-ec", "npm install && exec npm run dev"]
    environment:
      - NODE_ENV=development
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/').then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
