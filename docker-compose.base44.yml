services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:8080"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: ["sh", "-ec", "npm install && exec npm run dev -- --host 0.0.0.0"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8080/ | grep -q 'Vite Test App' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  node_modules:
